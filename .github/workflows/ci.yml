name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify (${{ matrix.os }} · node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 18.17 is the floor declared in package.json engines; keep it tested.
        node: ['18.17', '20', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Unit tests
        run: npm test

      - name: Static checks
        run: npm run lint

      - name: End-to-end self check
        run: npm run check

  package:
    name: package contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify the published tarball
        run: node ./scripts/pack-check.js

      - name: Smoke-test the packed CLI
        run: |
          tarball="$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/smoke"
          npm install --prefix "$RUNNER_TEMP/smoke" --no-audit --no-fund "./$tarball"
          "$RUNNER_TEMP/smoke/node_modules/.bin/agent-sweep" --version
          "$RUNNER_TEMP/smoke/node_modules/.bin/agent-sweep" harnesses
